site_name: k8s-sustain
site_description: Kubernetes operator for workload right-sizing and sustainability
site_url: https://noony.github.io/k8s-sustain
repo_url: https://github.com/noony/k8s-sustain
repo_name: noony/k8s-sustain
edit_uri: edit/main/docs/
copyright: Copyright &copy; k8s-sustain contributors &mdash; ISC License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - Prerequisites: getting-started/prerequisites.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Recommendation Pipeline: concepts/recommendation-pipeline.md
      - Update Modes: concepts/update-modes.md
      - In-Place Updates: concepts/in-place-updates.md
      - Autoscaler Coordination: concepts/autoscaler-coordination.md
      - Node Optimization: concepts/node-optimization.md
      - Workload Recommendations: concepts/workload-recommendations.md
  - Guides:
      - Workloads:
          - Deployments & StatefulSets: guides/deployments.md
          - DaemonSets: guides/daemonsets.md
          - Jobs & CronJobs: guides/jobs-and-cronjobs.md
          - Argo Rollouts: guides/argo-rollouts.md
          - Standalone Pods & Grouping: guides/standalone-pods-and-grouping.md
      - Integrations:
          - Argo CD: guides/argocd.md
          - KEDA: guides/keda.md
          - cert-manager (TLS): guides/cert-manager.md
      - Operations:
          - Dashboard: guides/dashboard.md
          - Authenticated Prometheus: guides/authenticated-prometheus.md
          - Local testing: guides/local-testing.md
          - Managing policies with Helm: guides/managing-policies-with-helm.md
  - Reference:
      - Policy CRD: reference/policy.md
      - Annotation: reference/annotation.md
      - CLI: reference/cli.md
      - Helm Values: reference/helm-values.md
      - Metrics: reference/metrics.md
      - Recording Rules: reference/recording-rules.md
  - Security: security.md
  - Development: development.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/noony/k8s-sustain
      name: k8s-sustain on GitHub
    - icon: fontawesome/brands/docker
      link: https://github.com/noony/k8s-sustain/pkgs/container/k8s-sustain
      name: Container image on GHCR
