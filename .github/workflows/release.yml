name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/noony/k8s-sustain
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        # The prometheus subchart tarball is gitignored, so it is absent in a
        # fresh checkout. `dependency build` fetches the version locked in
        # Chart.lock before packaging.
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build charts/k8s-sustain

      - name: Package charts
        run: |
          helm package charts/k8s-sustain --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          helm package charts/k8s-sustain-policies --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"

      - name: Upload chart to release
        uses: softprops/action-gh-release@v3
        with:
          # Tags containing a hyphen (e.g. v0.1.0-rc.1) are SemVer prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: "*.tgz"

  gh-release:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          # -trimpath: strip $GOPATH/build host paths from the binary so the
          #            output is reproducible across machines.
          # -s -w   : drop the symbol and DWARF tables (~30% smaller binary).
          # -X      : embed the tag as a build-time version string. Picked up
          #            by `k8s-sustain version` if/when that subcommand exists.
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/noony/k8s-sustain/internal/version.Version=${VERSION}"
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -ldflags "${LDFLAGS}" \
                -o "bin/k8s-sustain-${target%/*}-${target#*/}" ./
          done

      - name: Generate SHA256 checksums
        working-directory: bin
        run: |
          sha256sum k8s-sustain-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # Tags containing a hyphen (e.g. v0.1.0-rc.1) are SemVer prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            bin/k8s-sustain-*
            bin/sha256sums.txt
