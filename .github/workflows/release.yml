name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/noony/k8s-sustain
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Build chart dependencies
        # The prometheus subchart tarball is gitignored, so it is absent in a
        # fresh checkout. `dependency build` fetches the version locked in
        # Chart.lock before packaging.
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build charts/k8s-sustain

      - name: Package charts
        run: |
          helm package charts/k8s-sustain --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          helm package charts/k8s-sustain-policies --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"

      - name: Upload chart to release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          # Tags containing a hyphen (e.g. v0.1.0-rc.1) are SemVer prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: "*.tgz"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push charts to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm push "k8s-sustain-${VERSION}.tgz" oci://ghcr.io/noony/helm-charts
          helm push "k8s-sustain-policies-${VERSION}.tgz" oci://ghcr.io/noony/helm-charts

  gh-release:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          # -trimpath: strip $GOPATH/build host paths from the binary so the
          #            output is reproducible across machines.
          # -s -w   : drop the symbol and DWARF tables (~30% smaller binary).
          # -X      : embed the tag as a build-time version string. Picked up
          #            by `k8s-sustain version` if/when that subcommand exists.
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/noony/k8s-sustain/internal/version.Version=${VERSION}"
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -ldflags "${LDFLAGS}" \
                -o "bin/k8s-sustain-${target%/*}-${target#*/}" ./
          done

      - name: Generate SHA256 checksums
        working-directory: bin
        run: |
          sha256sum k8s-sustain-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          # Tags containing a hyphen (e.g. v0.1.0-rc.1) are SemVer prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            bin/k8s-sustain-*
            bin/sha256sums.txt

  docs:
    runs-on: ubuntu-latest
    # Prerelease tags (e.g. v0.1.0-rc.1) don't get a docs snapshot.
    if: "!contains(github.ref_name, '-')"
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Deploy versioned docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest

      - name: Check out published gh-pages content
        run: |
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages-site" origin/gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/gh-pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
