# scenario: cronjob-overprovisioned
# expected: A CronJob whose initial requests are dramatically larger than its
# real per-run usage. CPU request drops from 300m to ~45m and memory from
# 512Mi to ~50Mi within ~WINDOW + reconcile_interval, observed on each new
# scheduled run's pod (webhook-injected). The CronJob spec stays at its
# original 300m / 512Mi forever — that is the contract.
#
# (Measured on kind, k8s 1.35, WINDOW=10m: 43m / 51Mi on the run's pod, with
# the CronJob spec still reading 300m / 512Mi.)
#
# Mirrors the `overprovisioned` Deployment scenario but on the CronJob path,
# to confirm aggressive downsizing works for cronjobs too.
#
# Verification (after WINDOW + reconcile, look at the latest run's pod):
#
#   kubectl get pod -n scenario-cronjob-overprovisioned -l app=stress \
#     --sort-by=.metadata.creationTimestamp \
#     -o jsonpath='{.items[-1].spec.containers[0].resources}{"\n"}'
#   # CronJob spec is intentionally unchanged:
#   kubectl get cronjob -n scenario-cronjob-overprovisioned overprovisioned \
#     -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].resources}{"\n"}'

apiVersion: v1
kind: Namespace
metadata:
  name: scenario-cronjob-overprovisioned
  labels:
    k8s-sustain.io/scenario: cronjob-overprovisioned
---
apiVersion: k8s.sustain.io/v1alpha1
kind: Policy
metadata:
  name: scenario-cronjob-overprovisioned
spec:
  selector:
    namespaces: [scenario-cronjob-overprovisioned]
  rightSizing:
    update:
      types:
        cronJob: Ongoing
    resourcesConfigs:
      cpu:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 10
        limits:
          noLimit: true
      memory:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 15
        limits:
          requestsLimitsRatio: 1.5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen
  namespace: scenario-cronjob-overprovisioned
data:
  loadgen.py: |
    import os, time
    duty = float(os.environ.get('LOAD_DUTY', '0.05'))
    mem_mb = int(os.environ.get('LOAD_MEM_MB', '40'))
    runtime_s = float(os.environ.get('RUN_SECONDS', '90'))
    buf = bytearray(mem_mb * 1024 * 1024)
    for i in range(0, len(buf), 4096):
        buf[i] = 1
    def burn(d, deadline):
        period = 0.1
        on = period * d
        off = period - on
        while time.monotonic() < deadline:
            s = time.monotonic()
            while time.monotonic() - s < on:
                pass
            if off > 0:
                time.sleep(off)
    stop = time.monotonic() + runtime_s
    burn(duty, stop)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: overprovisioned
  namespace: scenario-cronjob-overprovisioned
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          annotations:
            k8s.sustain.io/policy: scenario-cronjob-overprovisioned
          labels:
            app: stress
        spec:
          restartPolicy: Never
          containers:
            - name: stress
              image: python:3.12-alpine
              command: ["python3", "/loadgen/loadgen.py"]
              env:
                - name: LOAD_DUTY
                  value: "0.05"   # ~50m of one core
                - name: LOAD_MEM_MB
                  value: "40"
                - name: RUN_SECONDS
                  value: "90"
              volumeMounts:
                - name: loadgen
                  mountPath: /loadgen
              resources:
                requests:
                  cpu: 300m
                  memory: 512Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: loadgen
              configMap:
                name: loadgen
