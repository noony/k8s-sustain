# scenario: recommend-only
# expected: NOTHING is ever applied, while the recommendation pipeline keeps
# running. Within ~max(WINDOW, young-workload gate ~10m) + reconcile_interval:
#   - a WorkloadRecommendation `deployment-stress` appears with ~220m CPU /
#     ~110Mi memory (same convergence target as `steady`),
#   - the pod is NEVER recycled: same UID, requests stay 500m/256Mi,
#   - the webhook does not inject either: delete the pod and the replacement
#     comes back with the template's 500m/256Mi,
#   - controller logs show `recommend-only: computed recommendations` with
#     source=policy (the webhook logs `recommend-only: would inject resources`
#     on pod creation — a second positive signal from the same grep).
# The Policy keeps `deployment: Ongoing` on purpose: it is the recommendOnly
# field, not the update mode, that suppresses the apply.
#
# Verify:
#   kubectl get wlrec -n scenario-recommend-only deployment-stress -o yaml
#   kubectl get pod -n scenario-recommend-only -l app=stress \
#     -o jsonpath='{.items[0].metadata.uid}{" "}{.items[0].spec.containers[0].resources.requests}{"\n"}'
#   # only run the delete after the wlrec above exists — before that, the
#   # young-workload gate would also leave the replacement unmutated and the
#   # check proves nothing:
#   kubectl delete pod -n scenario-recommend-only -l app=stress
#   # ... wait for the replacement, then re-run the jsonpath above: still 500m/256Mi
#   kubectl logs -n k8s-sustain -l app.kubernetes.io/name=k8s-sustain --tail=500 \
#     | grep 'recommend-only'

apiVersion: v1
kind: Namespace
metadata:
  name: scenario-recommend-only
  labels:
    k8s-sustain.io/scenario: recommend-only
---
apiVersion: k8s.sustain.io/v1alpha1
kind: Policy
metadata:
  name: scenario-recommend-only
spec:
  selector:
    namespaces: [scenario-recommend-only]
  rightSizing:
    recommendOnly: true
    update:
      types:
        deployment: Ongoing
    resourcesConfigs:
      cpu:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 10
        limits:
          noLimit: true
      memory:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 15
        limits:
          requestsLimitsRatio: 1.5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen
  namespace: scenario-recommend-only
data:
  loadgen.py: |
    import os, time
    duty = float(os.environ.get('LOAD_DUTY', '0.2'))
    mem_mb = int(os.environ.get('LOAD_MEM_MB', '50'))
    phases = os.environ.get('LOAD_PHASES', '').strip()
    buf = bytearray(mem_mb * 1024 * 1024)
    for i in range(0, len(buf), 4096):
        buf[i] = 1
    def burn(d, deadline):
        period = 0.1
        on = period * d
        off = period - on
        while time.monotonic() < deadline:
            s = time.monotonic()
            while time.monotonic() - s < on:
                pass
            if off > 0:
                time.sleep(off)
    if phases:
        schedule = [(float(p.split(':')[0]), float(p.split(':')[1])) for p in phases.split(',')]
        while True:
            for d, secs in schedule:
                burn(d, time.monotonic() + secs)
    else:
        burn(duty, float('inf'))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress
  namespace: scenario-recommend-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress
  template:
    metadata:
      labels:
        app: stress
      annotations:
        k8s.sustain.io/policy: scenario-recommend-only
    spec:
      containers:
      - name: stress
        image: python:3.12-alpine
        command: ["python3", "/loadgen/loadgen.py"]
        env:
          - name: LOAD_DUTY
            value: "0.20"   # ~200m of one core
          - name: LOAD_MEM_MB
            value: "100"
        volumeMounts:
          - name: loadgen
            mountPath: /loadgen
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 256Mi
      volumes:
        - name: loadgen
          configMap:
            name: loadgen
