# scenario: cronjob-long-running
# expected: A CronJob whose pod runs long enough that at least one reconcile
# pass occurs while the run is still alive. Validates the in-place resize
# path on a live, running CronJob pod with restartPolicy: Never (which is
# only fully supported by InPlacePodVerticalScaling on k8s ≥ 1.35).
#
# The CronJob spec is NEVER mutated. While a run is in flight, the controller
# patches the running pod via the pods/resize subresource — observable as a
# changing spec.containers[0].resources on the same pod over time, with the
# container never restarting.
#
# Schedule: every 15 minutes, but each run is allowed to live for up to 12
# minutes. concurrencyPolicy=Forbid prevents overlap. Initial requests:
# 500m / 256Mi. Steady per-run usage ~200m / 100Mi.
#
# Verification while a run is active (look for resources changing on the
# SAME pod, with no restart):
#
#   POD=$(kubectl get pod -n scenario-cronjob-long-running -l app=stress \
#     --field-selector status.phase=Running \
#     -o jsonpath='{.items[0].metadata.name}')
#   # snapshot now
#   kubectl get pod -n scenario-cronjob-long-running $POD \
#     -o jsonpath='{.spec.containers[0].resources}{"\n"}'
#   # then again after one reconcile interval (default 30s in the test harness)
#   sleep 60
#   kubectl get pod -n scenario-cronjob-long-running $POD \
#     -o jsonpath='{.spec.containers[0].resources}{"\n"}'
#   # restartCount stays at 0 — in-place resize, no kill
#   kubectl get pod -n scenario-cronjob-long-running $POD \
#     -o jsonpath='{.status.containerStatuses[0].restartCount}{"\n"}'
#
# To force the recycling pass quickly, run with WINDOW=2m and bring up the
# cluster with RECONCILE=30s; a typical run captures the resize within
# ~2-3 minutes of the run starting.

apiVersion: v1
kind: Namespace
metadata:
  name: scenario-cronjob-long-running
  labels:
    k8s-sustain.io/scenario: cronjob-long-running
---
apiVersion: k8s.sustain.io/v1alpha1
kind: Policy
metadata:
  name: scenario-cronjob-long-running
spec:
  selector:
    namespaces: [scenario-cronjob-long-running]
  rightSizing:
    update:
      types:
        cronJob: Ongoing
    resourcesConfigs:
      cpu:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 10
        limits:
          noLimit: true
      memory:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 15
        limits:
          requestsLimitsRatio: 1.5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen
  namespace: scenario-cronjob-long-running
data:
  loadgen.py: |
    import os, time
    duty = float(os.environ.get('LOAD_DUTY', '0.2'))
    mem_mb = int(os.environ.get('LOAD_MEM_MB', '100'))
    runtime_s = float(os.environ.get('RUN_SECONDS', '720'))
    buf = bytearray(mem_mb * 1024 * 1024)
    for i in range(0, len(buf), 4096):
        buf[i] = 1
    def burn(d, deadline):
        period = 0.1
        on = period * d
        off = period - on
        while time.monotonic() < deadline:
            s = time.monotonic()
            while time.monotonic() - s < on:
                pass
            if off > 0:
                time.sleep(off)
    stop = time.monotonic() + runtime_s
    burn(duty, stop)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: long-job
  namespace: scenario-cronjob-long-running
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 0
      # activeDeadlineSeconds caps the run at 12 min so a missed schedule
      # tick (e.g. controller paused for debugging) cannot leave a runaway pod.
      activeDeadlineSeconds: 720
      template:
        metadata:
          annotations:
            k8s.sustain.io/policy: scenario-cronjob-long-running
          labels:
            app: stress
        spec:
          restartPolicy: Never
          containers:
            - name: stress
              image: python:3.12-alpine
              command: ["python3", "/loadgen/loadgen.py"]
              env:
                - name: LOAD_DUTY
                  value: "0.20"   # ~200m of one core
                - name: LOAD_MEM_MB
                  value: "100"
                - name: RUN_SECONDS
                  value: "720"   # 12 min — long enough for ≥1 reconcile pass to land mid-run
              volumeMounts:
                - name: loadgen
                  mountPath: /loadgen
              resources:
                requests:
                  cpu: 500m
                  memory: 256Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: loadgen
              configMap:
                name: loadgen
