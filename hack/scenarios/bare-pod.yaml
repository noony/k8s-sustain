# scenario: bare-pod
# expected: a standalone Pod (no controller owner — simulating Airflow's
# KubernetesPodOperator, which by default launches a Pod directly with no
# parent Job). Unlike every other kind, the policy and owner-name
# annotations live directly on the Pod itself — there is no pod template to
# read them from. The Policy opts the "Pod" kind into Ongoing mode.
#
# Ongoing NEVER recycles a Pod-kind target, in any mode — there is no
# controller that could recreate this pod after an eviction or in-place
# resize. So the controller still computes and caches a recommendation
# (useful for the webhook's Prometheus-outage fallback on a later run sharing
# this owner-name), but the pod's own resources stay frozen at their initial
# (deliberately oversized) values forever.
#
# Expected, within a couple of reconcile cycles (no need to wait out the
# 10-minute MinWorkloadAge gate — it's bypassed for Pod-kind targets, since
# they never recycle, so the gate's purpose of avoiding an immediate bad
# recycle from a too-young percentile cannot apply to them):
#   - the pod's own resources are UNCHANGED from 500m / 256Mi below — no
#     recycle ever happens for Pod kind, regardless of how oversized it is.
#   - a WorkloadRecommendation named "pod-etl-daily" exists, computed from
#     the pod's actual ~200m / ~100Mi usage (the same target as `steady`,
#     since the load profile and resourcesConfigs match) — even though the
#     pod itself was never touched.
#
# Verify (status.sh's generic table assumes a Deployment named "stress" and
# does not cover this case):
#
#   # the pod gets the webhook-mirrored label
#   kubectl get pod -n scenario-bare-pod etl-daily-run-1 --show-labels | grep k8s.sustain.io/owner-name
#
#   # the pod's resources never change, no matter how long it runs
#   kubectl get pod -n scenario-bare-pod etl-daily-run-1 -o jsonpath='{.spec.containers[0].resources.requests}{"\n"}'
#
#   # the WorkloadRecommendation exists and reflects actual usage
#   kubectl get workloadrecommendation -n scenario-bare-pod
#   kubectl port-forward -n k8s-sustain svc/k8s-sustain-dashboard 8090:8090 &
#   curl -s localhost:8090/api/workloads/scenario-bare-pod/Pod/etl-daily/recommendations

apiVersion: v1
kind: Namespace
metadata:
  name: scenario-bare-pod
  labels:
    k8s-sustain.io/scenario: bare-pod
---
apiVersion: k8s.sustain.io/v1alpha1
kind: Policy
metadata:
  name: scenario-bare-pod
spec:
  selector:
    namespaces: [scenario-bare-pod]
  rightSizing:
    update:
      types:
        pod: Ongoing
    resourcesConfigs:
      cpu:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 10
        limits:
          noLimit: true
      memory:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 15
        limits:
          requestsLimitsRatio: 1.5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen
  namespace: scenario-bare-pod
data:
  loadgen.py: |
    import os, time
    duty = float(os.environ.get('LOAD_DUTY', '0.2'))
    mem_mb = int(os.environ.get('LOAD_MEM_MB', '50'))
    buf = bytearray(mem_mb * 1024 * 1024)
    for i in range(0, len(buf), 4096):
        buf[i] = 1
    def burn(d, deadline):
        period = 0.1
        on = period * d
        off = period - on
        while time.monotonic() < deadline:
            s = time.monotonic()
            while time.monotonic() - s < on:
                pass
            if off > 0:
                time.sleep(off)
    burn(duty, float('inf'))
---
apiVersion: v1
kind: Pod
metadata:
  name: etl-daily-run-1
  namespace: scenario-bare-pod
  labels:
    app: toto
  annotations:
    k8s.sustain.io/policy: scenario-bare-pod
    k8s.sustain.io/owner-name: etl-daily
spec:
  containers:
    - name: stress
      image: python:3.12-alpine
      command: ["python3", "/loadgen/loadgen.py"]
      env:
        - name: LOAD_DUTY
          value: "0.20"   # ~200m of one core
        - name: LOAD_MEM_MB
          value: "100"
      volumeMounts:
        - name: loadgen
          mountPath: /loadgen
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          memory: 256Mi
  volumes:
    - name: loadgen
      configMap:
        name: loadgen
