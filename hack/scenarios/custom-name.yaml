# scenario: custom-name
# expected: a single Deployment named "stress" whose pod template carries
# k8s.sustain.io/owner-name: renamed-app. The Deployment's real name ("stress")
# is never used for the Prometheus identity or the WorkloadRecommendation —
# the override renames both to "renamed-app". Otherwise behaves exactly like
# `steady`: CPU request drops from 500m to ~220m and memory request from
# 256Mi to ~110Mi within ~WINDOW + reconcile_interval. Pod is recycled
# exactly once.
#
# Verify the rename (status.sh's generic table queries recommendations by
# the Deployment's own name and does not cover this case):
#
#   # the pod gets the webhook-mirrored label
#   kubectl get pods -n scenario-custom-name --show-labels | grep k8s.sustain.io/owner-name
#
#   # the WorkloadRecommendation is named by the override ("deployment-renamed-app"),
#   # not by the Deployment's own name ("deployment-stress" does not exist)
#   kubectl get workloadrecommendation -n scenario-custom-name
#
#   # query it by the renamed identity, not by "stress"
#   kubectl port-forward -n k8s-sustain svc/k8s-sustain-dashboard 8090:8090 &
#   curl -s localhost:8090/api/workloads/scenario-custom-name/Deployment/renamed-app/recommendations

apiVersion: v1
kind: Namespace
metadata:
  name: scenario-custom-name
  labels:
    k8s-sustain.io/scenario: custom-name
---
apiVersion: k8s.sustain.io/v1alpha1
kind: Policy
metadata:
  name: scenario-custom-name
spec:
  selector:
    namespaces: [scenario-custom-name]
  rightSizing:
    update:
      types:
        deployment: Ongoing
    resourcesConfigs:
      cpu:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 10
        limits:
          noLimit: true
      memory:
        window: __WINDOW__
        requests:
          percentile: 95
          headroom: 15
        limits:
          requestsLimitsRatio: 1.5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen
  namespace: scenario-custom-name
data:
  loadgen.py: |
    import os, time
    duty = float(os.environ.get('LOAD_DUTY', '0.2'))
    mem_mb = int(os.environ.get('LOAD_MEM_MB', '50'))
    phases = os.environ.get('LOAD_PHASES', '').strip()
    buf = bytearray(mem_mb * 1024 * 1024)
    for i in range(0, len(buf), 4096):
        buf[i] = 1
    def burn(d, deadline):
        period = 0.1
        on = period * d
        off = period - on
        while time.monotonic() < deadline:
            s = time.monotonic()
            while time.monotonic() - s < on:
                pass
            if off > 0:
                time.sleep(off)
    if phases:
        schedule = [(float(p.split(':')[0]), float(p.split(':')[1])) for p in phases.split(',')]
        while True:
            for d, secs in schedule:
                burn(d, time.monotonic() + secs)
    else:
        burn(duty, float('inf'))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress
  namespace: scenario-custom-name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress
  template:
    metadata:
      labels:
        app: stress
      annotations:
        k8s.sustain.io/policy: scenario-custom-name
        k8s.sustain.io/owner-name: renamed-app
    spec:
      containers:
      - name: stress
        image: python:3.12-alpine
        command: ["python3", "/loadgen/loadgen.py"]
        env:
          - name: LOAD_DUTY
            value: "0.20"   # ~200m of one core
          - name: LOAD_MEM_MB
            value: "100"
        volumeMounts:
          - name: loadgen
            mountPath: /loadgen
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 256Mi
      volumes:
        - name: loadgen
          configMap:
            name: loadgen
