repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: verify-crds
        name: verify CRDs in sync
        entry: make verify-crds
        language: system
        pass_filenames: false
        files: ^(api/|charts/k8s-sustain/files/crds/)
      - id: verify-rules
        name: verify recording rules in sync
        entry: make verify-rules
        language: system
        pass_filenames: false
        files: ^charts/k8s-sustain/(values\.yaml|templates/prometheusrules\.yaml|files/recording-rules\.yaml)
      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'go mod tidy && git diff --exit-code go.mod go.sum'
        language: system
        pass_filenames: false
        files: '\.(go|mod|sum)$'
      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd internal/dashboard/ui/frontend && npx eslint src/'
        language: system
        files: ^internal/dashboard/ui/frontend/src/
        pass_filenames: false
      - id: frontend-format
        name: frontend format check
        entry: bash -c 'cd internal/dashboard/ui/frontend && npx prettier --check src/'
        language: system
        files: ^internal/dashboard/ui/frontend/src/
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd internal/dashboard/ui/frontend && npx vue-tsc --noEmit'
        language: system
        files: ^internal/dashboard/ui/frontend/src/
        pass_filenames: false
      - id: dist-placeholder
        name: ensure dist placeholder exists
        entry: bash -c 'test -f internal/dashboard/ui/dist/placeholder || { echo "internal/dashboard/ui/dist/placeholder is missing"; touch internal/dashboard/ui/dist/placeholder ; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
