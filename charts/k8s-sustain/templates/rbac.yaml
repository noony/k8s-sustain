apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-sustain.fullname" . }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
rules:
  # Policy CRD
  - apiGroups: [k8s.sustain.io]
    resources: [policies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [k8s.sustain.io]
    resources: [policies/status]
    verbs: [get, update, patch]
  - apiGroups: [k8s.sustain.io]
    resources: [policies/finalizers]
    verbs: [update]
  # WorkloadRecommendation CRD — the controller writes recommendations after
  # each reconcile and sweeps stale entries. The webhook shares this same
  # ClusterRole/ServiceAccount and needs:
  #   - list/watch, because it serves admission reads from an informer cache
  #     rather than hitting the apiserver per pod;
  #   - create, to write empty-status "stub" objects for workload identities
  #     nothing has computed yet, plus get and a status patch to record the
  #     admitted pod's container set on the stub. Creating the object is what
  #     puts the identity into the controller's work-list; the computation
  #     phase fills in the recommendation on its next cycle. The webhook never
  #     writes a recommendation itself — it computes nothing and queries
  #     Prometheus not at all.
  - apiGroups: [k8s.sustain.io]
    resources: [workloadrecommendations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [k8s.sustain.io]
    resources: [workloadrecommendations/status]
    verbs: [get, update, patch]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Workloads — apps (read-only; the webhook handles resource injection)
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  # Workloads — Argo Rollouts (read-only)
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list, watch]
  # Workloads — batch. Read-only: Ongoing mode resizes job pods in place via
  # pods/resize rather than mutating the CronJob/Job specs. The webhook also
  # resolves CronJob owners from Job pods.
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # Namespaces and Pods (in-place updates). get is used to resolve
  # namespace-level policy opt-in (k8s.sustain.io/policy on the Namespace).
  # Served from the informer cache in both the controller and the webhook,
  # which share this ClusterRole.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/resize]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  # HPA detection (read-only; autoscaler.Detect queries only)
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  # KEDA ScaledObjects (read-only; autoscaler.Detect queries only)
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch]
  # Events — controller emits reconcile/recycle events via EventRecorder.
  # Patch is required by client-go's EventBroadcaster for server-side
  # event aggregation/deduplication. The newer client-go events broadcaster
  # writes to events.k8s.io; the legacy one writes to the core group. Grant
  # both so we don't depend on which broadcaster the controller-runtime
  # version pulls in. The dashboard reads events via its own narrower role.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-sustain.fullname" . }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-sustain.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-sustain.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.dashboard.enabled }}
---
# Dedicated read-only ClusterRole for the dashboard. Strictly narrower than the
# controller role: no patch/eviction, no pods/resize, no policies/finalizers,
# no policy mutation. Events are read-only (used by the Overview activity
# feed to surface k8s-sustain reconcile/recycle events).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-sustain.dashboardName" . }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
rules:
  - apiGroups: [k8s.sustain.io]
    resources: [policies, workloadrecommendations]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-sustain.dashboardName" . }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-sustain.dashboardName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-sustain.dashboardName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
