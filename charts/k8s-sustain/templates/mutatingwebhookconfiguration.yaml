{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "k8s-sustain.fullname" . }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    # cert-manager injects the CA bundle automatically when this annotation is set.
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "k8s-sustain.webhookName" . }}
  {{- end }}
webhooks:
  - name: pods.k8s-sustain.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: 5
    # Only fire on CREATE — Ongoing mode and in-place updates are handled by the controller.
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE]
        scope: Namespaced
    clientConfig:
      service:
        name: {{ include "k8s-sustain.webhookName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: 443
      {{- if and (not .Values.webhook.certManager.enabled) .Values.webhook.caBundle }}
      caBundle: {{ .Values.webhook.caBundle }}
      {{- end }}
    # The namespaces every component excludes, the operator's own among them
    # to avoid loops: the apiserver never sends the webhook their pods.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- include "k8s-sustain.excludedNamespaces" . | fromJsonArray | toYaml | nindent 12 }}
{{- end }}
