{{/*
PrometheusRule for users running the Prometheus Operator externally.
Enable with: controller.serviceMonitor.enabled=true
When using the bundled prometheus subchart, recording rules are
embedded in prometheus.server.serverFiles instead.

The rule body lives in files/recording-rules.yaml — the single source
of truth. values.yaml's prometheus.serverFiles."recording_rules.yml".groups
is regenerated from the same file by `make sync-rules`.
*/}}
{{- if .Values.controller.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "k8s-sustain.fullname" . }}-percentiles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
{{ .Files.Get "files/recording-rules.yaml" | indent 4 }}
{{- end }}
