{{/*
PrometheusRule for users running the Prometheus Operator externally.
Enable with: prometheusRule.enabled=true
When using the bundled prometheus subchart, recording rules are
embedded in prometheus.server.serverFiles instead — leave this off.

The rule body is defined once in values.yaml's `prometheusRule.groups`
list and shared with the bundled subchart via a YAML anchor; both
consumers read the same source.
*/}}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "k8s-sustain.fullname" . }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml .Values.prometheusRule.groups | nindent 4 }}
{{- end }}
