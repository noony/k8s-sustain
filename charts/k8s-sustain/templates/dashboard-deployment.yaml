{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-sustain.dashboardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-sustain.dashboardSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-sustain.dashboardSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k8s-sustain.dashboardName" . }}
      terminationGracePeriodSeconds: {{ .Values.dashboard.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{ include "k8s-sustain.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - dashboard
            - --bind-address={{ .Values.dashboard.bindAddress }}
            - --prometheus-address={{ include "k8s-sustain.prometheusAddress" . }}
            - --log-level={{ .Values.dashboard.logLevel }}
            - --excluded-namespaces={{ concat (list .Release.Namespace "kube-system" "kube-public") .Values.excludedNamespaces | join "," }}
            {{- if .Values.dashboard.corsAllowedOrigins }}
            - --cors-allowed-origins={{ join "," .Values.dashboard.corsAllowedOrigins }}
            {{- end }}
            {{- with (include "k8s-sustain.prometheusAuthArgs" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with (include "k8s-sustain.prometheusAuthEnv" (dict "ctx" . "envPrefix" "K8SSUSTAIN_DASHBOARD_") | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              # Derived from bindAddress so the listener and port always agree.
              containerPort: {{ splitList ":" .Values.dashboard.bindAddress | last | int }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.dashboard.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.dashboard.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- with (include "k8s-sustain.prometheusAuthVolumeMounts" . | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (include "k8s-sustain.prometheusAuthVolumes" . | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
