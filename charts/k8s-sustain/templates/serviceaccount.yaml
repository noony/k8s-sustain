{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-sustain.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.dashboard.enabled }}
---
# Dedicated dashboard ServiceAccount — created whenever the dashboard is
# enabled (like its ClusterRole/Binding in rbac.yaml), independent of
# serviceAccount.create which only governs the controller/webhook identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-sustain.dashboardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
