apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-sustain.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-sustain.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-sustain.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-sustain.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k8s-sustain.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "k8s-sustain.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - start
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.controller.healthProbeBindAddress }}
            - --leader-elect={{ .Values.controller.leaderElect }}
            {{- if .Values.controller.leaderElectionID }}
            - --leader-election-id={{ .Values.controller.leaderElectionID }}
            {{- end }}
            - --prometheus-address={{ include "k8s-sustain.prometheusAddress" . }}
            - --log-level={{ .Values.controller.logLevel }}
            - --excluded-namespaces={{ concat (list .Release.Namespace "kube-system" "kube-public") .Values.excludedNamespaces | join "," }}
            - --workload-concurrency-limit={{ .Values.controller.workloadConcurrencyLimit }}
            - --policy-concurrency-limit={{ .Values.controller.policyConcurrencyLimit }}
            - --reconcile-interval={{ .Values.controller.reconcileInterval }}
            - --recycle-replacement-timeout={{ .Values.controller.recycleReplacementTimeout }}
            - --recommendation-retention={{ .Values.controller.recommendationRetention }}
            {{- /* Emitted only when set, rather than with a template-side
                   default. `helm upgrade --reuse-values` reuses the previous
                   release's values and does NOT pick up defaults newly added
                   to values.yaml, so a value referenced unconditionally here
                   would render as an empty `--flag=` on such an upgrade and
                   the container would refuse to start. Omitting the flag
                   instead falls through to the binary's own default, which
                   internal/controller's defaults-agree test pins to the same
                   number as values.yaml. */}}
            {{- with .Values.controller.prometheusMaxInflight }}
            - --prometheus-max-inflight={{ . }}
            {{- end }}
            {{- /* int64: Helm renders a plain large number as 2e+06, which the
                   flag parser rejects outright. */}}
            {{- with .Values.controller.queryShardMaxSamples }}
            - --query-shard-max-samples={{ int64 . }}
            {{- end }}
            {{- if .Values.recommendOnly }}
            - --recommend-only=true
            {{- end }}
            {{- with (include "k8s-sustain.prometheusAuthArgs" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with (include "k8s-sustain.prometheusAuthEnv" (dict "ctx" . "envPrefix" "K8SSUSTAIN_") | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            # Derived from the bind addresses so listeners and ports always agree.
            - name: metrics
              containerPort: {{ splitList ":" .Values.controller.metricsBindAddress | last | int }}
              protocol: TCP
            - name: health
              containerPort: {{ splitList ":" .Values.controller.healthProbeBindAddress | last | int }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.controller.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.controller.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- with (include "k8s-sustain.prometheusAuthVolumeMounts" . | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (include "k8s-sustain.prometheusAuthVolumes" . | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
