suite: webhook deployment
templates:
  - templates/webhook-deployment.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders by default with the webhook name and component labels
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: k8s-sustain-webhook
      - equal:
          path: metadata.namespace
          value: k8s-sustain
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: k8s-sustain-0.1.0
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/version: "0.1.0"
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: webhook
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/component: webhook

  - it: renders nothing when the webhook is disabled
    set:
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: passes the default webhook args
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - webhook
            - --port=9443
            - --log-level=error
            - --tls-cert-file=/tls/tls.crt
            - --tls-key-file=/tls/tls.key
            - --excluded-namespaces=k8s-sustain,kube-system,kube-public
            - --recommendation-retention=168h

  # The webhook's --recommendation-retention is rendered from the SAME value as
  # the controller's (deployment_test.yaml pins that one). It bounds the single
  # path where the webhook injects from a recommendation older than its
  # staleness budget — an identity the controller marked departed — and that
  # bound is only meaningful if it is the window after which the controller's
  # sweep deletes the object. One value, two flags: a webhook-specific key here
  # could drift into serving what the controller already considers expired.
  - it: bounds the webhook departed path with the controller's retention window
    set:
      controller.recommendationRetention: 24h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --recommendation-retention=24h

  # The webhook no longer queries Prometheus at all: it reads recommendations
  # from WorkloadRecommendation objects. A --prometheus-address here would be
  # an unknown flag and the container would refuse to start.
  - it: passes no prometheus address to the webhook
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: prometheus-address

  # The webhook serves admission reads from a WorkloadRecommendation informer
  # rather than hitting the apiserver per pod. That cache is resident memory —
  # roughly 20-50 MB at 10k workloads — so the default request must leave room
  # for it, or the webhook OOMs on large clusters exactly when it matters.
  - it: sizes webhook memory for the informer cache
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: reuses the controller service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: k8s-sustain

  - it: webhook uses the overridden serviceAccount name
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa

  - it: mounts the TLS secret read-only
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: tls
              secret:
                secretName: k8s-sustain-webhook-tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tls
              mountPath: /tls
              readOnly: true

  - it: uses a custom TLS secret name when configured
    set:
      webhook.tlsSecretName: my-tls
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: my-tls

  - it: exposes the webhook and health ports with HTTPS probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: health
              containerPort: 8082
              protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: webhook
            scheme: HTTPS
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /healthz
            port: webhook
            scheme: HTTPS

  - it: renders the default probe timings
    asserts:
      - isSubset:
          path: spec.template.spec.containers[0].livenessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
      - isSubset:
          path: spec.template.spec.containers[0].readinessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

  # The webhook builds its informer cache BEFORE the HTTPS listener starts, and
  # that build waits up to crdWaitTimeout (internal/k8s/client.go, 2m) for the
  # CRDs to be served. Nothing answers /healthz until it finishes. Liveness and
  # readiness alone kill the container at 10 + 10*3 = 40s — on exactly the
  # fresh-install CRD race the wait exists for — so a startupProbe must suspend
  # them until the listener is up, with a budget larger than crdWaitTimeout.
  #
  # 5 + 5*36 = 185s > 120s. helm-unittest cannot do that arithmetic, so the
  # inequality itself is asserted from the Go side, against crdWaitTimeout, for
  # BOTH copies of the numbers: TestCRDWaitFitsInsideChartStartupProbeBudget for
  # values.yaml and TestCRDWaitFitsInsideChartTemplateStartupProbeDefaults for
  # the template's own defaults. This suite pins what those numbers render to.
  - it: gives the webhook a startup budget larger than the CRD-establishment wait
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet
          value:
            path: /healthz
            port: webhook
            scheme: HTTPS
      - isSubset:
          path: spec.template.spec.containers[0].startupProbe
          content:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 36

  # `helm upgrade --reuse-values` reuses the previous release's values and does
  # NOT pick up defaults newly added to values.yaml, so every release installed
  # before webhook.startupProbe existed upgrades with that key absent. Rendered
  # under `with`, the probe would then vanish entirely and the container would
  # be back on liveness/readiness alone (10 + 10*3 = 40s) against a startup that
  # can block for crdWaitTimeout (2m) — the exact CrashLoopBackOff the probe
  # exists to prevent, reintroduced on the upgrade path only. The template
  # therefore carries its own defaults; this pins them, and pins that they
  # still exceed crdWaitTimeout.
  - it: keeps the startup probe when the release's values carry none
    set:
      webhook.startupProbe: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet
          value:
            path: /healthz
            port: webhook
            scheme: HTTPS
      # 5 + 5*36 = 185s > 120s, same budget as the values.yaml defaults —
      # TestCRDWaitFitsInsideChartTemplateStartupProbeDefaults is what enforces
      # both halves of that sentence against crdWaitTimeout.
      - isSubset:
          path: spec.template.spec.containers[0].startupProbe
          content:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 36

  # A partial override must not drop the remaining template defaults, or an
  # operator raising one field would silently shrink the budget elsewhere.
  - it: keeps template defaults for the startup-probe fields a release overrides only in part
    set:
      webhook.startupProbe:
        failureThreshold: 60
    asserts:
      - isSubset:
          path: spec.template.spec.containers[0].startupProbe
          content:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 60

  - it: wires custom probe timings into the probes
    set:
      webhook.livenessProbe.initialDelaySeconds: 30
      webhook.readinessProbe.failureThreshold: 6
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 6
      # The probe endpoint stays fixed regardless of timing overrides.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS

  - it: wires a custom webhook port into args and container ports
    set:
      webhook.port: 8443
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --port=8443
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8443

  - it: enforces the restricted security contexts
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

  - it: adds the recommend-only flag when recommendOnly is set
    set:
      recommendOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --recommend-only=true

  - it: appends excludedNamespaces to the built-in exclusions
    set:
      excludedNamespaces: [team-a]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --excluded-namespaces=k8s-sustain,kube-system,kube-public,team-a

  - it: honors replica count overrides
    set:
      webhook.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
