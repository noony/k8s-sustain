suite: webhook deployment
templates:
  - templates/webhook-deployment.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders by default with the webhook name and component labels
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: k8s-sustain-webhook
      - equal:
          path: metadata.namespace
          value: k8s-sustain
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: k8s-sustain-0.1.0
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/version: "0.1.0"
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: webhook
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/component: webhook

  - it: renders nothing when the webhook is disabled
    set:
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: passes the default webhook args
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - webhook
            - --port=9443
            - --prometheus-address=http://k8s-sustain-prometheus-server.k8s-sustain.svc:80
            - --log-level=debug
            - --tls-cert-file=/tls/tls.crt
            - --tls-key-file=/tls/tls.key
            - --excluded-namespaces=k8s-sustain,kube-system,kube-public

  - it: reuses the controller service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: k8s-sustain

  - it: mounts the TLS secret read-only
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: tls
              secret:
                secretName: k8s-sustain-webhook-tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tls
              mountPath: /tls
              readOnly: true

  - it: uses a custom TLS secret name when configured
    set:
      webhook.tlsSecretName: my-tls
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: my-tls

  - it: exposes the webhook and health ports with HTTPS probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: health
              containerPort: 8082
              protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: webhook
            scheme: HTTPS
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /healthz
            port: webhook
            scheme: HTTPS

  - it: renders the default probe timings
    asserts:
      - isSubset:
          path: spec.template.spec.containers[0].livenessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
      - isSubset:
          path: spec.template.spec.containers[0].readinessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

  - it: wires custom probe timings into the probes
    set:
      webhook.livenessProbe.initialDelaySeconds: 30
      webhook.readinessProbe.failureThreshold: 6
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 6
      # The probe endpoint stays fixed regardless of timing overrides.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS

  - it: wires a custom webhook port into args and container ports
    set:
      webhook.port: 8443
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --port=8443
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8443

  - it: enforces the restricted security contexts
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

  - it: adds the recommend-only flag when recommendOnly is set
    set:
      recommendOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --recommend-only=true

  - it: appends webhook.excludedNamespaces to the built-in exclusions
    set:
      webhook.excludedNamespaces: [team-a]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --excluded-namespaces=k8s-sustain,kube-system,kube-public,team-a

  - it: honors replica count overrides
    set:
      webhook.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
