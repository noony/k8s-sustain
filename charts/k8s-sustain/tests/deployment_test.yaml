suite: controller deployment
templates:
  - templates/deployment.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders a Deployment with metadata, labels and replicas by default
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: metadata.name
          value: k8s-sustain
      - equal:
          path: metadata.namespace
          value: k8s-sustain
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: k8s-sustain-0.1.0
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/version: "0.1.0"
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain

  - it: wires service account, grace period and image defaults
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: k8s-sustain
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].name
          value: controller
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/noony/k8s-sustain:0.1.0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: passes the default controller args
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - start
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect=true
            - --prometheus-address=http://k8s-sustain-prometheus-server.k8s-sustain.svc:80
            - --log-level=error
            - --excluded-namespaces=k8s-sustain,kube-system,kube-public
            - --workload-concurrency-limit=5
            - --policy-concurrency-limit=10
            - --reconcile-interval=5m
            - --recycle-replacement-timeout=5m
            - --recommendation-retention=168h
            - --prometheus-max-inflight=8
            - --query-shard-max-samples=10000000

  # Both query-load knobs must be reachable from values, or an operator
  # whose Prometheus is being starved has no way to turn the controller down
  # without patching the Deployment by hand.
  - it: threads the query-load tuning values into the controller args
    set:
      controller.prometheusMaxInflight: 4
      controller.queryShardMaxSamples: 2000000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-max-inflight=4
      - contains:
          path: spec.template.spec.containers[0].args
          content: --query-shard-max-samples=2000000

  # Regression: `helm upgrade --reuse-values` reuses the previous release's
  # values and does NOT pick up defaults newly added to values.yaml. A value
  # referenced unconditionally would render `--prometheus-max-inflight=` with
  # an empty argument, and the controller exits at startup with
  # "invalid argument \"\" ... invalid syntax" — an upgrade that bricks the
  # controller. Unset must omit the flag entirely so the binary's own default
  # applies instead.
  - it: omits the query-load flags entirely when their values are unset
    set:
      controller.prometheusMaxInflight: null
      controller.queryShardMaxSamples: null
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--prometheus-max-inflight=$
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--query-shard-max-samples=$

  - it: enforces the restricted security contexts
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

  - it: exposes metrics and health ports with probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: health

  - it: renders the default probe timings
    asserts:
      - isSubset:
          path: spec.template.spec.containers[0].livenessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
      - isSubset:
          path: spec.template.spec.containers[0].readinessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

  - it: wires custom probe timings into the probes
    set:
      controller.livenessProbe.initialDelaySeconds: 30
      controller.livenessProbe.failureThreshold: 6
      controller.readinessProbe.periodSeconds: 5
      controller.readinessProbe.timeoutSeconds: 2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 6
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 2
      # The probe endpoints stay fixed regardless of timing overrides.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: derives the container ports from the bind address port parts
    set:
      controller.metricsBindAddress: ":9090"
      controller.healthProbeBindAddress: 127.0.0.1:9091
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 9091
              protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:9090
      - contains:
          path: spec.template.spec.containers[0].args
          content: --health-probe-bind-address=127.0.0.1:9091

  - it: applies the default resources
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

  - it: omits the recommend-only flag by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --recommend-only=true

  - it: adds the recommend-only flag when recommendOnly is set
    set:
      recommendOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --recommend-only=true

  - it: adds the leader election id flag when configured
    set:
      controller.leaderElectionID: my-lock
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-id=my-lock

  - it: can disable leader election
    set:
      controller.leaderElect: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=false

  - it: prefers an explicit prometheusAddress over subchart autodetection
    set:
      prometheusAddress: http://thanos.example:10902
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-address=http://thanos.example:10902

  - it: falls back to localhost when the subchart is disabled and no address is set
    set:
      prometheus.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-address=http://localhost:9090

  - it: appends excludedNamespaces to the built-in exclusions
    set:
      excludedNamespaces: [team-a, team-b]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --excluded-namespaces=k8s-sustain,kube-system,kube-public,team-a,team-b

  - it: renders recommendation-retention from values
    set:
      controller:
        recommendationRetention: 24h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --recommendation-retention=24h

  - it: uses image.tag over the chart appVersion when set
    set:
      image.tag: v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/noony/k8s-sustain:v9.9.9

  - it: renders imagePullSecrets when provided
    set:
      imagePullSecrets:
        - name: regcred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: regcred

  - it: honors a custom termination grace period
    set:
      controller.terminationGracePeriodSeconds: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: renders scheduling constraints when provided
    set:
      controller.nodeSelector:
        disktype: ssd
      controller.tolerations:
        - key: dedicated
          operator: Equal
          value: infra
          effect: NoSchedule
      controller.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [arm64]
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            disktype: ssd
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Equal
              value: infra
              effect: NoSchedule
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch
