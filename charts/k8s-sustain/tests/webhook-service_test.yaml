suite: webhook service
templates:
  - templates/webhook-service.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders by default and maps 443 to the webhook port
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: k8s-sustain-webhook
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/component: webhook
      - equal:
          path: spec.ports
          value:
            - name: https
              port: 443
              targetPort: 9443
              protocol: TCP

  - it: renders nothing when the webhook is disabled
    set:
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: follows webhook.port for the target port
    set:
      webhook.port: 8443
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 8443
