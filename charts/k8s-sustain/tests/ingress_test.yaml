suite: ingress
templates:
  - templates/ingress.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the default host to the dashboard service when enabled
    set:
      ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: k8s-sustain
      - notExists:
          path: spec.ingressClassName
      - notExists:
          path: spec.tls
      - equal:
          path: spec.rules[0].host
          value: dashboard.local
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: ImplementationSpecific
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: k8s-sustain-dashboard
            port:
              number: 8090

  - it: renders className, annotations and tls when provided
    set:
      ingress.enabled: true
      ingress.className: nginx
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      ingress.tls:
        - hosts: [dashboard.local]
          secretName: dashboard-tls
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: metadata.annotations
          value:
            cert-manager.io/cluster-issuer: letsencrypt
      - equal:
          path: spec.tls
          value:
            - hosts: [dashboard.local]
              secretName: dashboard-tls

  - it: follows the dashboard service port
    set:
      ingress.enabled: true
      dashboard.service.port: 9090
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9090
