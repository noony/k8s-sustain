suite: webhook certificate
templates:
  - templates/webhook-certificate.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a self-signed Issuer and Certificate when certManager is enabled
    set:
      webhook.certManager.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Issuer
        documentIndex: 0
      - equal:
          path: metadata.name
          value: k8s-sustain-webhook-selfsigned
        documentIndex: 0
      - exists:
          path: spec.selfSigned
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: metadata.name
          value: k8s-sustain-webhook
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: k8s-sustain-webhook-tls
        documentIndex: 1
      - equal:
          path: spec.issuerRef
          value:
            name: k8s-sustain-webhook-selfsigned
            kind: Issuer
        documentIndex: 1

  - it: issues the certificate for all service DNS forms
    set:
      webhook.certManager.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.dnsNames
          value:
            - k8s-sustain-webhook
            - k8s-sustain-webhook.k8s-sustain
            - k8s-sustain-webhook.k8s-sustain.svc
            - k8s-sustain-webhook.k8s-sustain.svc.cluster.local

  - it: uses an external issuer when createIssuer is disabled
    set:
      webhook.certManager.enabled: true
      webhook.certManager.createIssuer: false
      webhook.certManager.issuerRef.name: my-ca
      webhook.certManager.issuerRef.kind: ClusterIssuer
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Certificate
      - equal:
          path: spec.issuerRef
          value:
            name: my-ca
            kind: ClusterIssuer

  - it: follows the tlsSecretName override
    set:
      webhook.certManager.enabled: true
      webhook.tlsSecretName: my-tls
    documentIndex: 1
    asserts:
      - equal:
          path: spec.secretName
          value: my-tls

  - it: renders nothing when the webhook is disabled even with certManager on
    set:
      webhook.enabled: false
      webhook.certManager.enabled: true
    asserts:
      - hasDocuments:
          count: 0
