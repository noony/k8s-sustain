suite: service monitors
templates:
  - templates/servicemonitor.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the controller monitor when enabled
    set:
      controller.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: k8s-sustain
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              interval: 30s
              scrapeTimeout: 10s

  - it: adds controller additionalLabels
    set:
      controller.serviceMonitor.enabled: true
      controller.serviceMonitor.additionalLabels:
        release: kube-prometheus-stack
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            release: kube-prometheus-stack

  - it: renders the webhook monitor with TLS skip-verify when enabled
    set:
      webhook.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: k8s-sustain-webhook
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: webhook
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/component: webhook
      - equal:
          path: spec.endpoints
          value:
            - port: https
              scheme: https
              path: /metrics
              interval: 30s
              scrapeTimeout: 10s
              tlsConfig:
                insecureSkipVerify: true

  - it: suppresses the webhook monitor when the webhook itself is disabled
    set:
      webhook.enabled: false
      webhook.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders both monitors when both are enabled
    set:
      controller.serviceMonitor.enabled: true
      webhook.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: k8s-sustain
        documentIndex: 0
      - equal:
          path: metadata.name
          value: k8s-sustain-webhook
        documentIndex: 1
