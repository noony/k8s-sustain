suite: prometheus rule
templates:
  - templates/prometheusrule.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the rule with all recording groups when enabled
    set:
      prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.name
          value: k8s-sustain-rules
      - equal:
          path: metadata.namespace
          value: k8s-sustain
      - lengthEqual:
          path: spec.groups
          count: 8
      - equal:
          path: spec.groups[0].name
          value: k8s_sustain.workload_mapping

  - it: keeps the container label in the OOM recency rule
    set:
      prometheusRule.enabled: true
    asserts:
      # spec.groups[6] is k8s_sustain.workload_signals; rules[2] is the OOM
      # rule. The per-container grouping is load-bearing: the recommender
      # floors only containers that actually OOMed, so dropping `container`
      # from the sum would silently re-inflate innocent sidecars.
      - equal:
          path: spec.groups[6].rules[2].record
          value: k8s_sustain:workload_oom_24h
      - matchRegex:
          path: spec.groups[6].rules[2].expr
          pattern: 'sum by \(namespace, owner_kind, owner_name, container\)'

  - it: adds the owner-name override rule to workload_mapping with the four base rules unless-guarded
    set:
      prometheusRule.enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 8
      - equal:
          path: spec.groups[0].rules[4].record
          value: k8s_sustain:pod_owner_kind_internal
      - matchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: 'kube_pod_owner\{'
      - equal:
          path: spec.groups[0].rules[5].record
          value: k8s_sustain:pod_workload
      - matchRegex:
          path: spec.groups[0].rules[5].expr
          pattern: 'kube_pod_annotations\{annotation_k8s_sustain_io_owner_name=~"\[A-Za-z0-9\]\(\[-A-Za-z0-9_\.\]\{0,61\}\[A-Za-z0-9\]\)\?"\}'
      - matchRegex:
          path: spec.groups[0].rules[5].expr
          pattern: 'k8s_sustain:pod_owner_kind_internal'
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'unless on\(namespace, pod\) kube_pod_annotations\{annotation_k8s_sustain_io_owner_name=~"\[A-Za-z0-9\]\(\[-A-Za-z0-9_\.\]\{0,61\}\[A-Za-z0-9\]\)\?"\}'

  - it: records OOM kills after every pod_workload rule of workload_mapping
    set:
      prometheusRule.enabled: true
    asserts:
      # Rules of one group run in order at the same instant, so a pod killed
      # before its first scrape is already mapped when its kill is recorded.
      - equal:
          path: spec.groups[0].rules[6].record
          value: k8s_sustain:container_oom_kills
      - matchRegex:
          path: spec.groups[0].rules[6].expr
          pattern: 'k8s_sustain:pod_workload\s*$'

  - it: records the killed-at limit in the kill rule's group, reading the kill as far back as its window of running instances
    set:
      prometheusRule.enabled: true
    asserts:
      # The kill rule's evaluations are one interval apart, so the instances
      # with no sample in the last 3m are exactly those with none since the
      # kill read 3m back.
      - equal:
          path: spec.groups[0].rules[7].record
          value: k8s_sustain:container_oom_kill_limit:bytes
      - matchRegex:
          path: spec.groups[0].rules[7].expr
          pattern: 'unless\s+last_over_time\(container_spec_memory_limit_bytes\{[^}]*\}\[3m\]\)'
      - matchRegex:
          path: spec.groups[0].rules[7].expr
          pattern: 'k8s_sustain:container_oom_kills offset 3m'

  - it: adds additionalLabels
    set:
      prometheusRule.enabled: true
      prometheusRule.additionalLabels:
        role: alert-rules
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            role: alert-rules
