suite: service accounts
templates:
  - templates/serviceaccount.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders a single service account by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: k8s-sustain
      - equal:
          path: metadata.namespace
          value: k8s-sustain
      - notExists:
          path: metadata.annotations

  - it: renders annotations when provided
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/k8s-sustain
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/k8s-sustain

  - it: honors a custom service account name
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: renders nothing when creation is disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: adds the dashboard service account when the dashboard is enabled
    set:
      dashboard.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: k8s-sustain-dashboard
        documentIndex: 1
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: dashboard
        documentIndex: 1

  - it: skips the dashboard service account too when creation is disabled
    set:
      serviceAccount.create: false
      dashboard.enabled: true
    asserts:
      - hasDocuments:
          count: 0
