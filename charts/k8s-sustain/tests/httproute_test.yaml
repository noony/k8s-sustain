suite: httproute
templates:
  - templates/httproute.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the default hostname to the dashboard service when enabled
    set:
      httpRoute.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: k8s-sustain-dashboard
      - equal:
          path: spec.parentRefs
          value:
            - name: gateway
              sectionName: http
      - equal:
          path: spec.hostnames
          value:
            - dashboard.local
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: k8s-sustain-dashboard
              port: 8090
              weight: 1

  - it: renders annotations and filters when provided
    set:
      httpRoute.enabled: true
      httpRoute.annotations:
        external-dns.alpha.kubernetes.io/target: gw.example.com
      httpRoute.rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Env
                    value: prod
    asserts:
      - equal:
          path: metadata.annotations
          value:
            external-dns.alpha.kubernetes.io/target: gw.example.com
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestHeaderModifier

  - it: follows the dashboard service port in backendRefs
    set:
      httpRoute.enabled: true
      dashboard.service.port: 9090
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9090
