suite: dashboard deployment
templates:
  - templates/dashboard-deployment.yaml
release:
  name: k8s-sustain
  namespace: k8s-sustain
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the dashboard deployment when enabled
    set:
      dashboard.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: k8s-sustain-dashboard
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: k8s-sustain-0.1.0
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/version: "0.1.0"
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: dashboard
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: k8s-sustain
            app.kubernetes.io/instance: k8s-sustain
            app.kubernetes.io/component: dashboard

  - it: uses its own dedicated service account
    set:
      dashboard.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: k8s-sustain-dashboard

  - it: passes the default dashboard args
    set:
      dashboard.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - dashboard
            - --bind-address=:8090
            - --prometheus-address=http://k8s-sustain-prometheus-server.k8s-sustain.svc:80
            - --log-level=debug

  - it: adds the CORS flag only when origins are configured
    set:
      dashboard.enabled: true
      dashboard.corsAllowedOrigins:
        - https://a.example
        - https://b.example
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cors-allowed-origins=https://a.example,https://b.example

  - it: exposes the http port with probes
    set:
      dashboard.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http
              containerPort: 8090
              protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: http

  - it: renders the default probe timings
    set:
      dashboard.enabled: true
    asserts:
      - isSubset:
          path: spec.template.spec.containers[0].livenessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
      - isSubset:
          path: spec.template.spec.containers[0].readinessProbe
          content:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

  - it: wires custom probe timings into the probes
    set:
      dashboard.enabled: true
      dashboard.livenessProbe.periodSeconds: 30
      dashboard.readinessProbe.initialDelaySeconds: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 1
      # The probe endpoints stay fixed regardless of timing overrides.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: derives the container port from the bindAddress port part
    set:
      dashboard.enabled: true
      dashboard.bindAddress: ":9000"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9000
      - contains:
          path: spec.template.spec.containers[0].args
          content: --bind-address=:9000

  - it: supports a host-qualified bindAddress
    set:
      dashboard.enabled: true
      dashboard.bindAddress: 127.0.0.1:9999
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --bind-address=127.0.0.1:9999
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9999

  - it: enforces the restricted security contexts and default resources
    set:
      dashboard.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
