image:
  repository: ghcr.io/noony/k8s-sustain
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# When true, both the controller and webhook compute recommendations but never
# patch workloads or mutate pods (dry-run mode).
recommendOnly: false

# Prometheus server URL, shared by all components (controller, webhook, dashboard).
# Leave empty to auto-detect the bundled prometheus subchart service.
# Override only when using an external Prometheus instance.
# Example: http://prometheus.monitoring.svc:9090
prometheusAddress: ""

controller:
  replicaCount: 1
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  leaderElect: true
  # Lease name for leader election. Override when running multiple operator
  # installs side-by-side in the same cluster.
  leaderElectionID: ""
  concurrencyLimit: 5
  # When the controller falls back to eviction-based recycling (k8s < 1.31 or
  # InPlacePodVerticalScaling disabled), it waits this long for the workload
  # controller to bring a replacement pod back to Ready before evicting the
  # next stale pod. Must cover the slowest realistic recovery — Karpenter /
  # cluster-autoscaler node provisioning regularly takes several minutes on a
  # cold start. Setting it too low produces false-positive aborts during
  # normal scale-up.
  recycleReplacementTimeout: 5m
  logLevel: debug
  service:
    type: ClusterIP
    port: 8080
    # Extra annotations for the metrics Service. The chart already adds
    # prometheus.io/scrape, prometheus.io/port, and prometheus.io/path so the
    # bundled Prometheus subchart picks up the controller's metrics endpoint.
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  # ServiceMonitor for the controller metrics endpoint.
  # Only useful when running the Prometheus Operator (e.g. kube-prometheus-stack).
  # Not needed when using the bundled prometheus subchart.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels added to the ServiceMonitor. Use this to match a specific
    # Prometheus operator's `serviceMonitorSelector` in clusters with multiple
    # Prometheus instances (e.g. {release: kube-prometheus-stack}).
    additionalLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# PrometheusRule for the k8s-sustain recording rules, for users running the
# Prometheus Operator externally (e.g. kube-prometheus-stack).
# Leave disabled when using the bundled `prometheus` subchart — recording rules
# are already embedded in prometheus.server.serverFiles in that case, and
# enabling both would duplicate the series.
prometheusRule:
  enabled: false
  # Extra labels added to the PrometheusRule. Use this to match a specific
  # Prometheus operator's `ruleSelector` in clusters with multiple Prometheus
  # instances (e.g. {release: kube-prometheus-stack}).
  additionalLabels: {}
  # Recording rules used to compute right-sizing recommendations and power
  # the dashboard. Anchored so the bundled prometheus subchart can alias the
  # same list (see prometheus.serverFiles."recording_rules.yml" below) —
  # both consumers read the same source, so there is no drift to manage.
  # The list is consumed regardless of `enabled`; the toggle only gates
  # whether a standalone PrometheusRule resource is rendered.
  groups: &recordingRulesGroups
    - name: k8s_sustain.workload_mapping
      interval: 1m
      rules:
        # Map pod → workload for direct owners (StatefulSet, DaemonSet, Job).
        # Jobs that are themselves owned by a CronJob are excluded here so
        # those pods only appear with owner_kind=CronJob (see CronJob rule
        # below). Without this exclusion the same pod would carry two
        # pod_workload series, breaking group_left joins downstream.
        - record: k8s_sustain:pod_workload
          expr: |
            max by (namespace, pod, owner_kind, owner_name) (
              kube_pod_owner{
                owner_kind=~"StatefulSet|DaemonSet|Job",
                owner_is_controller="true"
              }
              unless on(namespace, pod)
              (
                label_replace(
                  kube_pod_owner{owner_kind="Job", owner_is_controller="true"},
                  "job_name", "$1", "owner_name", "(.*)"
                )
                * on(namespace, job_name) group_left
                max by (namespace, job_name) (
                  kube_job_owner{owner_kind="CronJob", owner_is_controller="true"}
                )
              )
            )
        # Map pod → CronJob by resolving Job → CronJob via kube_job_owner.
        # Mirrors the ReplicaSet → Deployment pattern: rename owner_name (Job)
        # to job_name, clear owner labels, then group_left from kube_job_owner.
        - record: k8s_sustain:pod_workload
          expr: |
            max by (namespace, pod, owner_kind, owner_name) (
              label_replace(
                label_replace(
                  label_replace(
                    max by (namespace, pod, owner_kind, owner_name, owner_is_controller) (
                      kube_pod_owner{owner_kind="Job", owner_is_controller="true"}
                    ),
                    "job_name", "$1", "owner_name", "(.*)"
                  ),
                  "owner_kind", "", "owner_kind", ".*"
                ),
                "owner_name", "", "owner_name", ".*"
              )
              * on(namespace, job_name) group_left(owner_kind, owner_name)
              max by (namespace, job_name, owner_kind, owner_name) (
                kube_job_owner{owner_kind="CronJob", owner_is_controller="true"}
              )
            )
        # Map pod → Deployment by resolving ReplicaSet → Deployment.
        # Renames owner_name (RS name) → replicaset and clears conflicting labels
        # so group_left can inject owner_kind/owner_name from kube_replicaset_owner.
        # Both sides are deduplicated with max by() to handle multiple
        # kube-state-metrics instances producing duplicate series.
        - record: k8s_sustain:pod_workload
          expr: |
            max by (namespace, pod, owner_kind, owner_name) (
              label_replace(
                label_replace(
                  label_replace(
                    max by (namespace, pod, owner_kind, owner_name, owner_is_controller) (
                      kube_pod_owner{owner_kind="ReplicaSet", owner_is_controller="true"}
                    ),
                    "replicaset", "$1", "owner_name", "(.*)"
                  ),
                  "owner_kind", "", "owner_kind", ".*"
                ),
                "owner_name", "", "owner_name", ".*"
              )
              * on(namespace, replicaset) group_left(owner_kind, owner_name)
              max by (namespace, replicaset, owner_kind, owner_name) (
                kube_replicaset_owner{owner_kind="Deployment", owner_is_controller="true"}
              )
            )
        # Argo Rollouts: Pod → ReplicaSet → Rollout
        - record: k8s_sustain:pod_workload
          expr: |
            max by (namespace, pod, owner_kind, owner_name) (
              label_replace(
                label_replace(
                  label_replace(
                    max by (namespace, pod, owner_kind, owner_name, owner_is_controller) (
                      kube_pod_owner{owner_kind="ReplicaSet", owner_is_controller="true"}
                    ),
                    "replicaset", "$1", "owner_name", "(.*)"
                  ),
                  "owner_kind", "", "owner_kind", ".*"
                ),
                "owner_name", "", "owner_name", ".*"
              )
              * on(namespace, replicaset) group_left(owner_kind, owner_name)
              max by (namespace, replicaset, owner_kind, owner_name) (
                kube_replicaset_owner{owner_kind="Rollout", owner_is_controller="true"}
              )
            )
    - name: k8s_sustain.cpu_rates
      interval: 1m
      rules:
        # Per-container CPU usage rate.
        # Primary rate uses a 1m window so percentile-based rightsizing
        # captures sub-5m bursts that a longer window would smooth away.
        # Falls back to a 5m window for short-running pods (CronJobs, Jobs)
        # whose lifetime is too brief to accumulate ≥2 samples in 1m.
        # node!="" drops cAdvisor series that briefly lose the node label
        # during scrape transitions.
        - record: k8s_sustain:container_cpu_usage:rate1m
          expr: |
            max by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{
                container!="",
                container!="POD",
                image!="",
                node!=""
              }[1m:10s])
            )
            or
            max by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{
                container!="",
                container!="POD",
                image!="",
                node!=""
              }[5m])
            )
        # Per-container CPU rate WITH workload labels — used by the operator.
        - record: k8s_sustain:container_cpu_usage_by_workload:rate1m
          expr: |
            k8s_sustain:container_cpu_usage:rate1m
            * on(namespace, pod) group_left(owner_kind, owner_name)
            k8s_sustain:pod_workload
    - name: k8s_sustain.memory_rates
      interval: 1m
      rules:
        # Per-container memory working set (excludes reclaimable page cache).
        # max by (namespace, pod, container) deduplicates series that cAdvisor
        # can briefly emit twice for the same container (e.g. cgroup v1+v2
        # hierarchies, scrape transitions). Without it, downstream `or` and
        # `*` joins inflate or fail with many-to-many.
        # node!="" drops cAdvisor series that briefly lose the node label.
        - record: k8s_sustain:container_memory_working_set:bytes
          expr: |
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{
                container!="",
                container!="POD",
                image!="",
                node!=""
              }
            )
        # Per-container memory WITH workload labels — used by the operator.
        - record: k8s_sustain:container_memory_by_workload:bytes
          expr: |
            k8s_sustain:container_memory_working_set:bytes
            * on(namespace, pod) group_left(owner_kind, owner_name)
            k8s_sustain:pod_workload
    - name: k8s_sustain.resource_requests
      interval: 1m
      rules:
        # Per-container CPU requests WITH workload labels — used by the dashboard.
        - record: k8s_sustain:container_cpu_requests_by_workload:cores
          expr: |
            max by (namespace, container, owner_kind, owner_name) (
              kube_pod_container_resource_requests{resource="cpu", container!="", container!="POD"}
              * on(namespace, pod) group_left(owner_kind, owner_name)
              k8s_sustain:pod_workload
            )
        # Per-container memory requests WITH workload labels — used by the dashboard.
        - record: k8s_sustain:container_memory_requests_by_workload:bytes
          expr: |
            max by (namespace, container, owner_kind, owner_name) (
              kube_pod_container_resource_requests{resource="memory", container!="", container!="POD"}
              * on(namespace, pod) group_left(owner_kind, owner_name)
              k8s_sustain:pod_workload
            )
        # Per-container CPU limits WITH workload labels — used by the dashboard so
        # the chart reflects the actually-applied per-pod limit (after webhook
        # injection) rather than the static workload-spec value, which the
        # operator deliberately never touches.
        - record: k8s_sustain:container_cpu_limits_by_workload:cores
          expr: |
            max by (namespace, container, owner_kind, owner_name) (
              kube_pod_container_resource_limits{resource="cpu", container!="", container!="POD"}
              * on(namespace, pod) group_left(owner_kind, owner_name)
              k8s_sustain:pod_workload
            )
        # Per-container memory limits WITH workload labels — same rationale as the
        # CPU limits rule above.
        - record: k8s_sustain:container_memory_limits_by_workload:bytes
          expr: |
            max by (namespace, container, owner_kind, owner_name) (
              kube_pod_container_resource_limits{resource="memory", container!="", container!="POD"}
              * on(namespace, pod) group_left(owner_kind, owner_name)
              k8s_sustain:pod_workload
            )

    - name: k8s_sustain.savings_aggregates
      interval: 1m
      rules:
        # Cluster-total CPU savings: sum over workloads of (template request - recommendation).
        # Uses k8s_sustain_workload_template_cpu_cores (the original pod-template request,
        # stable across webhook injection) so savings reflect the gap from the user's
        # original spec to the recommendation, not the injected pod's already-rightsized value.
        - record: k8s_sustain:cluster_cpu_savings_cores
          expr: |
            sum(
              k8s_sustain_workload_template_cpu_cores
              - on(namespace, owner_kind, owner_name, container, policy)
              k8s_sustain_recommended_cpu_cores
            )

        - record: k8s_sustain:cluster_memory_savings_bytes
          expr: |
            sum(
              k8s_sustain_workload_template_memory_bytes
              - on(namespace, owner_kind, owner_name, container, policy)
              k8s_sustain_recommended_memory_bytes
            )

        - record: k8s_sustain:cluster_cpu_savings_ratio
          expr: |
            k8s_sustain:cluster_cpu_savings_cores
            / on()
            sum(k8s_sustain_workload_template_cpu_cores)

        - record: k8s_sustain:cluster_memory_savings_ratio
          expr: |
            k8s_sustain:cluster_memory_savings_bytes
            / on()
            sum(k8s_sustain_workload_template_memory_bytes)

        # Per-policy savings: same delta, grouped by the policy label which both metrics carry.
        - record: k8s_sustain:policy_cpu_savings_cores
          labels:
            resource: cpu
          expr: |
            sum by (policy) (
              k8s_sustain_workload_template_cpu_cores
              - on(namespace, owner_kind, owner_name, container, policy)
              k8s_sustain_recommended_cpu_cores
            )

        - record: k8s_sustain:policy_memory_savings_bytes
          labels:
            resource: memory
          expr: |
            sum by (policy) (
              k8s_sustain_workload_template_memory_bytes
              - on(namespace, owner_kind, owner_name, container, policy)
              k8s_sustain_recommended_memory_bytes
            )

    - name: k8s_sustain.headroom
      interval: 1m
      rules:
        # Cluster-level breakdown. We deliberately use raw kube-state-metrics
        # / cAdvisor inputs (not the *_by_workload rules) so static pods,
        # mirror pods, and bare pods without an owner mapping still count
        # toward usage and idle — otherwise `free` is overstated by their
        # un-subtracted requests.
        - record: k8s_sustain:cluster_cpu_headroom_breakdown
          expr: |
            label_replace(sum(k8s_sustain:container_cpu_usage:rate1m), "segment", "used", "", "")
            or
            label_replace(
              sum(kube_pod_container_resource_requests{resource="cpu", container!="", container!="POD"}) - sum(k8s_sustain:container_cpu_usage:rate1m),
              "segment", "idle", "", ""
            )
            or
            label_replace(
              sum(kube_node_status_allocatable{resource="cpu"}) - sum(kube_pod_container_resource_requests{resource="cpu", container!="", container!="POD"}),
              "segment", "free", "", ""
            )

        - record: k8s_sustain:cluster_memory_headroom_breakdown
          expr: |
            label_replace(sum(k8s_sustain:container_memory_working_set:bytes), "segment", "used", "", "")
            or
            label_replace(
              sum(kube_pod_container_resource_requests{resource="memory", container!="", container!="POD"}) - sum(k8s_sustain:container_memory_working_set:bytes),
              "segment", "idle", "", ""
            )
            or
            label_replace(
              sum(kube_node_status_allocatable{resource="memory"}) - sum(kube_pod_container_resource_requests{resource="memory", container!="", container!="POD"}),
              "segment", "free", "", ""
            )

    - name: k8s_sustain.workload_signals
      interval: 1m
      rules:
        # True peak memory observed per (namespace, pod, container) over 24h.
        # max_over_time on container_memory_working_set_bytes alone misses
        # sub-scrape spikes (a container can OOM in <1s after touching the
        # limit). The kernel's high-water mark (cgroup v1: max_usage_bytes,
        # cgroup v2: peak_working_set_bytes) survives across scrape gaps and
        # is the authoritative signal here.
        # Each candidate signal is tagged with a distinct `_src` label so they
        # all survive the `or`, then max-by drops `_src` to take the overall
        # high-water value.
        # NOTE: we deliberately do NOT include the cgroup limit in this signal.
        # Using the limit-at-OOM-time would create a feedback loop: each reco
        # raises the limit, the next OOM is recorded at the new limit, the
        # peak follows, and the recommender keeps multiplying by (1+headroom)
        # forever. Kernel high-water + working-set max are bounded by actual
        # memory pressure and converge once the workload fits.
        - record: k8s_sustain:container_peak_memory_24h:bytes
          expr: |
            max by (namespace, owner_kind, owner_name, container) (
              (
                label_replace(
                  max by (namespace, pod, container) (max_over_time(container_memory_max_usage_bytes{container!="", container!="POD", image!="", node!=""}[24h])),
                  "_src", "max_usage", "", ""
                )
                or
                label_replace(
                  max by (namespace, pod, container) (max_over_time(container_memory_peak_working_set_bytes{container!="", container!="POD", image!="", node!=""}[24h])),
                  "_src", "peak_ws", "", ""
                )
                or
                label_replace(
                  max by (namespace, pod, container) (max_over_time(container_memory_working_set_bytes{container!="", container!="POD", image!="", node!=""}[24h:1m])),
                  "_src", "working_set", "", ""
                )
              )
              * on(namespace, pod) group_left(owner_kind, owner_name)
              k8s_sustain:pod_workload
            )

        # OOM-time memory limit: the cgroup memory limit observed at the moment
        # an OOM event fired. Used by the recommender as a bump anchor —
        # max(peak, oom_time_limit * bump_factor) — so workloads whose peak
        # working-set is unreliable (cgroup v2, sub-scrape spikes) still get
        # pushed above the limit the kernel killed them at.
        #
        # Why this doesn't create the feedback loop the peak rule's comment
        # warned about: this rule only records the limit at moments a NEW OOM
        # event fires (restart counter increased AND last_terminated_reason is
        # OOMKilled). Once the recommender bumps the limit and the workload
        # fits, no new OOM events fire, so the recorded limit stays at the OLD
        # (pre-bump) value and stops growing. After 24h with no further OOMs
        # the signal drains and the recommendation falls back to the percentile.
        - record: k8s_sustain:container_oom_limit_24h:bytes
          expr: |
            max by (namespace, owner_kind, owner_name, container) (
              max by (namespace, pod, container) (
                max_over_time(
                  (
                    container_spec_memory_limit_bytes{container!="", container!="POD", image!="", node!=""}
                    and on(namespace, pod, container)
                    (changes(kube_pod_container_status_restarts_total{container!="", container!="POD"}[2m]) > 0)
                    and on(namespace, pod, container)
                    (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container!="", container!="POD"} == 1)
                  )[24h:1m]
                )
              )
              * on(namespace, pod) group_left(owner_kind, owner_name)
              k8s_sustain:pod_workload
            )

        # OOM detection combines two paths so it works for both restartable
        # workloads (Deployment/StatefulSet/DaemonSet/Rollout) AND one-shot Job
        # pods (Job/CronJob).
        #
        # - "restarts" path: counts OOM events as restarts where the prior
        #   termination reason was OOMKilled. Accurate event count for pods that
        #   the kubelet restarts in place.
        # - "kill" path: 0/1 indicator that the (pod, container) was OOMKilled at
        #   any point in the 24h window. Catches Job pods that fail once and are
        #   never restarted, where `restarts_total` stays at 0.
        #
        # Each path is tagged with a distinct `_src` label so both survive the
        # `or` union; `max by (namespace, pod, container)` then drops `_src` and
        # takes the larger value. For a Deployment pod that OOMed N times the
        # restart path dominates (N > 1); for a Job pod the kill path provides
        # the 1 that the restart path can't see.
        - record: k8s_sustain:workload_oom_24h
          expr: |
            sum by (namespace, owner_kind, owner_name) (
              max by (namespace, pod, container) (
                label_replace(
                  max by (namespace, pod, container) (
                    increase(
                      kube_pod_container_status_restarts_total{container!="", container!="POD"}[24h]
                    )
                  )
                  * on(namespace, pod, container) group_left()
                  max by (namespace, pod, container) (
                    kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container!="", container!="POD"}
                  ),
                  "_src", "restarts", "", ""
                )
                or
                label_replace(
                  max by (namespace, pod, container) (
                    max_over_time(
                      kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container!="", container!="POD"}[24h]
                    )
                  ),
                  "_src", "kill", "", ""
                )
              )
              * on(namespace, pod) group_left(owner_kind, owner_name)
              k8s_sustain:pod_workload
            )

        - record: k8s_sustain:workload_drifted
          expr: |
            (
              max by (namespace, owner_kind, owner_name) (
                abs(1 - k8s_sustain_workload_drift_ratio)
              ) > 0.10
            ) * 1

    - name: k8s_sustain.workload_signal
      interval: 1m
      rules:
        # Total CPU usage across all replicas, per container, per workload.
        - record: k8s_sustain:workload_cpu_usage:cores
          expr: |
            sum by (namespace, owner_kind, owner_name, container) (
              k8s_sustain:container_cpu_usage_by_workload:rate1m
            )
        # Total memory working set across all replicas, per container, per workload.
        - record: k8s_sustain:workload_memory_usage:bytes
          expr: |
            sum by (namespace, owner_kind, owner_name, container) (
              k8s_sustain:container_memory_by_workload:bytes
            )
        # Busiest-replica CPU rate, per container, per workload. At each instant
        # this is the hottest live pod; collapsing across pods here (instead of
        # at query time) keeps the recommender's quantile_over_time subquery
        # cheap (one series per workload×container) and immune to pod-name churn
        # — dead pods simply drop out of the max. The recommender runs
        # quantile_over_time(p, …) over this to get a true per-pod percentile
        # that covers the busiest replica.
        - record: k8s_sustain:workload_max_pod_cpu:cores
          expr: |
            max by (namespace, owner_kind, owner_name, container) (
              k8s_sustain:container_cpu_usage_by_workload:rate1m
            )
        # Busiest-replica memory working set, per container, per workload.
        # Same rationale as workload_max_pod_cpu above.
        - record: k8s_sustain:workload_max_pod_memory:bytes
          expr: |
            max by (namespace, owner_kind, owner_name, container) (
              k8s_sustain:container_memory_by_workload:bytes
            )

serviceAccount:
  create: true
  name: ""
  # Annotations to add to the service account (e.g. for IRSA, Workload Identity).
  annotations: {}

# Install the CRD as part of the chart.
# Set to false if you manage CRDs separately.
installCRDs: true

# Admission webhook — intercepts Pod CREATE and injects resources for OnCreate policies.
webhook:
  enabled: true
  # Number of webhook server replicas. ≥2 recommended for production HA.
  replicaCount: 1
  port: 9443
  logLevel: debug
  # failurePolicy controls what happens when the webhook is unreachable.
  # "Ignore" (default) lets pods through; "Fail" blocks them.
  failurePolicy: Ignore
  # Extra namespaces to exclude from webhook interception (in addition to the
  # release namespace and kube-system / kube-public which are always excluded).
  excludedNamespaces: []
  # Name of the Secret containing tls.crt and tls.key for the webhook server.
  # Created automatically by cert-manager when certManager.enabled=true.
  tlsSecretName: k8s-sustain-webhook-tls
  # caBundle is the base64-encoded CA certificate used by the API server to
  # verify the webhook TLS cert. Required when certManager.enabled=false.
  caBundle: ""
  certManager:
    # Set to true to create a cert-manager Certificate and inject the CA bundle
    # automatically via the cert-manager.io/inject-ca-from annotation.
    enabled: false
    # Create a self-signed Issuer in the release namespace.
    # Set to false if you want to use your own Issuer/ClusterIssuer (configure issuerRef below).
    createIssuer: true
    issuerRef:
      # Only used when createIssuer is false.
      name: ""
      kind: Issuer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  # ServiceMonitor for the webhook /metrics endpoint (cert expiry gauge etc.).
  # Only useful when running the Prometheus Operator (e.g. kube-prometheus-stack).
  # Not needed when using the bundled prometheus subchart, which scrapes the
  # webhook via its own scrape config.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Same as controller.serviceMonitor.additionalLabels — use to match a
    # specific Prometheus operator's serviceMonitorSelector.
    additionalLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Expose the dahboard service via ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dashboard.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# -- Expose the dahboard service via gateway-api HTTPRoute
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - dashboard.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

# Dashboard — web UI for policy exploration, workload metrics, and simulation.
dashboard:
  enabled: false
  replicaCount: 1
  port: 8090
  bindAddress: ":8090"
  logLevel: debug
  # Allowed CORS origins. Empty (default) is same-origin only — the safe choice.
  # Add a list of trusted origins (e.g. ["https://grafana.example.com"]) to embed
  # the dashboard in another tool. Use ["*"] to allow all origins (not recommended).
  corsAllowedOrigins: []
  service:
    type: ClusterIP
    port: 8090
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# prometheus subchart — https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus

prometheus:
  enabled: true

  # Components we don't need.
  alertmanager:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

  # Required: kube-state-metrics provides pod→workload mapping labels.
  kube-state-metrics:
    enabled: true

  server:
    retention: 15d
    persistentVolume:
      enabled: true
      size: 20Gi

  # Lock the bundled Prometheus down to a minimal, scoped scrape set so it
  # NEVER picks up arbitrary `prometheus.io/scrape: "true"` targets in other
  # namespaces. The chart's default scrapeConfigs that scrape cluster-wide
  # annotation-based targets are disabled by name; only the jobs we need stay
  # enabled or are added.
  scrapeConfigs:
    prometheus: { enabled: true }
    kubernetes-api-servers: { enabled: false }
    kubernetes-nodes: { enabled: false }
    # cAdvisor on each node — required for container CPU/mem metrics. Cluster
    # scope is intrinsic to cAdvisor (it sees all containers on its node).
    # We override relabel_configs to inject a `node` label from the kubelet
    # target's node name. The upstream prometheus chart's default config does
    # NOT add this label (it only labelmaps node-level labels and rewrites
    # metrics_path), so cAdvisor series ship without `node`. The recording
    # rules use `node!=""` to drop scrape-transition flickers, and without
    # this override every input series would be filtered out — leaving the
    # rate/working-set rules empty. kube-prometheus-stack injects `node` by
    # default, so external-Prometheus users typically already have it.
    kubernetes-nodes-cadvisor:
      enabled: true
      scrape_interval: 20s
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__metrics_path__]
        target_label: metrics_path
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      # Keep only the cAdvisor series the recording rules consume. Everything
      # else (network, fs, accelerator, hugepages, sched stats, etc.) is dropped
      # at ingestion to slash TSDB cardinality.
      metric_relabel_configs:
      - action: keep
        source_labels: [__name__]
        regex: "container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_max_usage_bytes|container_memory_peak_working_set_bytes|container_spec_memory_limit_bytes"
      - action: labeldrop
        regex: "container_id|host_ip|id|image_id|image_spec|internal_ip|name|pod_ip|provider_id|system_uuid|uid"
    # Disabled — these scrape ANY pod/service in ANY namespace that carries the
    # `prometheus.io/scrape: "true"` annotation.
    kubernetes-service-endpoints: { enabled: false }
    kubernetes-service-endpoints-slow: { enabled: false }
    kubernetes-services: { enabled: false }
    kubernetes-pods: { enabled: false }
    kubernetes-pods-slow: { enabled: false }
    prometheus-pushgateway: { enabled: false }

  # k8s-sustain / kube-state-metrics components only — restricted to Prometheus's own namespace
  extraScrapeConfigs: |
    - job_name: k8s-sustain
      honor_labels: true
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            own_namespace: true
      relabel_configs:
        - action: keep
          source_labels: [__meta_kubernetes_service_name]
          regex: ^.*-metrics$
        - action: drop
          source_labels: [__meta_kubernetes_service_name]
          regex: ^.*-kube-state-metrics$
        # Only scrape ports actually serving metrics — drops the controller's
        # healthz port and any non-metrics container port discovered alongside.
        - action: keep
          source_labels: [__meta_kubernetes_endpoint_port_name]
          regex: metrics
        - action: replace
          source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - action: replace
          source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - action: replace
          source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
        - action: replace
          source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    - job_name: kube-state-metrics
      # Required so the labels exported by kube-state-metrics (namespace, pod,
      # owner_*, etc.) survive scraping. Without this, Prometheus rewrites the
      # `namespace` and `pod` labels to the kube-state-metrics target's identity
      # and the kube_pod_* series collapse onto a single (namespace, pod) — which
      # makes pod_workload match every workload in the cluster.
      honor_labels: true
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            own_namespace: true
      relabel_configs:
        # Only the controller's metrics service and kube-state-metrics. The
        # webhook service shares the app.kubernetes.io/name label so we filter
        # by service name suffix instead.
        - action: keep
          source_labels: [__meta_kubernetes_service_name]
          regex: ^.*-kube-state-metrics$
        # Only scrape ports actually serving metrics — drops the controller's
        # healthz port and any non-metrics container port discovered alongside.
        - action: keep
          source_labels: [__meta_kubernetes_endpoint_port_name]
          regex: metrics|http
        - action: replace
          source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - action: replace
          source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - action: replace
          source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
        - action: replace
          source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
      # Keep only the kube-state-metrics series the recording rules consume.
      # Everything else (node info, deployment status, hpa, pdb, services, etc.)
      # is dropped at ingestion to slash TSDB cardinality.
      metric_relabel_configs:
        - action: keep
          source_labels: [__name__]
          regex: "kube_pod_owner|kube_job_owner|kube_replicaset_owner|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_node_status_allocatable"
        - action: labeldrop
          regex: "container_id|host_ip|id|image_id|image_spec|internal_ip|pod_ip|provider_id|system_uuid|uid|unit"

  serverFiles:
    recording_rules.yml:
      groups: *recordingRulesGroups
