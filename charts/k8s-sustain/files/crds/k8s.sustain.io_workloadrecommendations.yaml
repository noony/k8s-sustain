                          properties:
                            determined:
                              description: 'Determined is true when the floor set
                                the final request: it beat the percentile and no min/max
                                clamp, before or after coordination, replaced the
                                value.'
                              type: boolean
                            value:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Value is the higher of the 24h peak working
