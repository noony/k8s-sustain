---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workloadrecommendations.k8s.sustain.io
spec:
  group: k8s.sustain.io
  names:
    kind: WorkloadRecommendation
    listKind: WorkloadRecommendationList
    plural: workloadrecommendations
    shortNames:
    - wlrec
    singular: workloadrecommendation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workloadRef.kind
      name: Workload
      type: string
    - jsonPath: .spec.workloadRef.name
      name: Name
      type: string
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .status.observedAt
      name: ObservedAt
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkloadRecommendation is the cached output of the recommendation pipeline
          for a single workload, written by the controller and read by the webhook.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkloadRecommendationSpec identifies the workload this recommendation
              applies to, and the Policy that produced it.
            properties:
              policy:
                description: Policy is the name of the Policy that produced this recommendation;
                  empty means no Policy matches the workload anymore and the object
                  will be garbage-collected.
                type: string
              workloadRef:
                description: WorkloadRef identifies the workload these recommendations
                  describe.
                properties:
                  kind:
                    enum:
                    - Deployment
                    - StatefulSet
                    - DaemonSet
                    - CronJob
                    - Job
                    - Rollout
                    - Pod
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                - namespace
                type: object
            required:
            - workloadRef
            type: object
          status:
            description: |-
              WorkloadRecommendationStatus is the observed recommendation, written by the
              controller and read by the webhook as its only recommendation source.
            properties:
              containers:
                additionalProperties:
                  description: |-
                    ContainerRecommendation is the per-container recommended resource set. An
                    unset quantity means "leave the spec entry alone"; RemoveCPULimit and
                    RemoveMemoryLimit carry the explicit "strip the limit" intent.
                  properties:
                    cpuLimit:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    cpuRequest:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    memoryLimit:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    memoryRequest:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    removeCpuLimit:
                      type: boolean
                    removeMemoryLimit:
                      type: boolean
                  type: object
                description: Containers maps container name to recommended resources.
                type: object
              departed:
                description: Departed marks a recommendation retained for a workload
                  identity that no longer exists (a TTL-deleted Job, a bare-pod group
                  between runs), whose ObservedAt is therefore frozen.
                type: boolean
              observedAt:
                description: ObservedAt is when the recommendation was last refreshed
                  from Prometheus.
                format: date-time
                type: string
              observedResources:
                additionalProperties:
                  description: |-
                    ObservedContainerResources is the requests/limits snapshot of one container
                    at the last observation. Nil means the container had no value set.
                  properties:
                    cpuLimit:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    cpuRequest:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    init:
                      description: Init marks containers that come from the pod's
                        initContainers list.
                      type: boolean
                    memoryLimit:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    memoryRequest:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                  type: object
                description: ObservedResources maps container name to the requests
                  and limits the container actually ran with when the recommendation
                  was written.
                type: object
              source:
                description: 'Source describes where the recommendation came from:
                  "prometheus" or "nodata".'
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
