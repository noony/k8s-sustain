                            replicaFactor:
                              description: ReplicaFactor is the replica-budget correction,
                                clamp(current / target replicas, 0.5, 2). CPU only,
                                set when the Policy has a replicaBudgetAnchor.
                              type: number
                            scaled:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Scaled is the clamped request multiplied
