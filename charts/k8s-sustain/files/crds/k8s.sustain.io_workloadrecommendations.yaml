                          type: object
                        percentile:
                          anyOf:
                          - type: integer
                          - type: string
                          description: Percentile is the usage percentile of the busiest
                            pod over the window. Unset for a memory request anchored
                            on an OOM kill alone.
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        removeLimit:
                          description: RemoveLimit is true when the limit is stripped.
                          type: boolean
                        withHeadroom:
                          anyOf:
                          - type: integer
                          - type: string
                          description: WithHeadroom is the higher of the percentile
                            and the OOM floor, plus headroom, rounded up to a whole
