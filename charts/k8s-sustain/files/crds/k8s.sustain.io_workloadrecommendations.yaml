                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            value:
                              anyOf:
                              - type: integer
                              - type: string
                              description: 'Value is Scaled clamped to minAllowed/maxAllowed
