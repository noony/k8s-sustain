                          required:
                          - overheadFactor
                          - scaled
                          - value
                          type: object
                        limit:
                          anyOf:
                          - type: integer
                          - type: string
                          description: Limit is the limit derived from the final request.
                            Unset with removeLimit false keeps the container's own
